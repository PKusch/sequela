name: A task the oracle gets wrong
description: The answer key disagrees with what a careful person would say.
body:
  - type: input
    id: task
    attributes:
      label: Task id
      description: The `id` field of the line in `data/tasks.jsonl` or `data/heldout.jsonl`.
      placeholder: "t04-0"
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: What the answer key says
      description: The decision, effects and severity recorded under `truth`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you think it should say, and why
      description: A sentence on the reasoning is worth more than the label. If a policy can score well on this task without understanding it, say that instead.
    validations:
      required: true
