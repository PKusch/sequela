name: checks

# The README states a task count and a set of calibration numbers. This runs
# the tests, regenerates the dataset and the held-out split and fails if
# either committed copy has drifted, then re-runs every reference respondent
# on both, so the numbers in the README are checked rather than asserted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    name: python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Dataset is current
        run: python -m sequela.run check
      - name: Reference respondents, main and held-out
        # `memorised` scores like the oracle on the main set; the held-out
        # line under the table is where it is caught.
        run: |
          for p in oracle uncoupled trusting name_reader schema_blind paranoid memorised; do
            python -m sequela.run run reference:$p --out /tmp/$p.json >/dev/null
            python -m sequela.run run reference:$p --heldout --out /tmp/$p.heldout.json >/dev/null
          done
          python -m sequela.run report /tmp/*.json

  kaggle-adapter:
    # The adapter's glue against the real SDK, kept out of the matrix so the
    # benchmark itself stays dependency-free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -q kaggle-benchmarks
      - run: python -m unittest tests.test_kaggle_adapter -v
